<style>
:root{--cream:#F7F2E8;--paper:#FFFDF8;--line:#E6DDC9;--line2:#D9CCAE;--ink:#2B2A26;--ink2:#4A463E;--muted:#6B655A;--olive:#4F5D3A;--gold:#B08A3E;--goldtext:#7A5D1F;--sand:#EFE6D2;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;min-height:100vh}
#app.full{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
a{color:var(--olive);text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin:0}
h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--goldtext)}
.muted{color:var(--muted);font-size:15px;line-height:1.5}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack4{display:flex;flex-direction:column;gap:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink);display:block}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:999px;border:none;background:var(--olive);color:#FBF8F1;font-size:17px;font-weight:700;padding:0 20px;width:100%}
.btn.ghost{background:var(--paper);color:var(--olive);border:1px solid var(--line2);font-size:16px}
.btn.text{background:transparent;color:var(--olive);min-height:48px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.round{width:54px;height:54px;flex-shrink:0;border-radius:999px;border:1px solid var(--line2);background:var(--paper);color:var(--olive);display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:700;background:none;border:none;color:var(--olive);padding:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;font-size:14px;font-weight:700;color:var(--ink);background:var(--paper)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;color:var(--olive);background:#EEF0E6}
.tag.due{color:var(--goldtext);background:#F1E4CC}
.tag.new{color:var(--muted);background:var(--sand)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:999px}
.serif{font-family:var(--serif)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--olive);color:#FBF8F1;border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:#E3D7B8}
.hero .lift{background:#FBF8F1;color:var(--olive);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.subj{display:flex;flex-direction:column;gap:8px}
.subj b{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1}
.subj span{font-size:12px;color:var(--muted)}
.vname{font-weight:700;font-size:15px}
.vtext{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink2)}
#tabs{position:fixed;left:0;right:0;bottom:0;background:#FBF8F1;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;font-size:12px;font-weight:600;color:var(--muted)}
#tabs a.on{color:var(--olive);font-weight:800}
#tabs.hide{display:none}
.practice{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:30px 24px;display:flex;flex-direction:column;gap:18px;justify-content:center;min-height:340px}
.words{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.3em;row-gap:10px;font-family:var(--serif);font-size:30px;line-height:1.25;text-align:center;font-weight:500}
.w{white-space:nowrap}
.w .h{color:transparent;border-bottom:2px solid var(--gold);cursor:pointer}
.w .h.peek{color:var(--goldtext)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:28px;height:6px;border-radius:999px;background:#E2D8C2}
.dots i.on{background:var(--olive)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.on{background:var(--olive);border-color:var(--olive);color:#FBF8F1;font-weight:700}
.chip.dash{border-style:dashed;color:var(--olive);font-weight:700;display:inline-flex;align-items:center;gap:6px}
input[type=text],input[type=search],textarea{width:100%;background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink)}
textarea{resize:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink2)}
.ibox{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.bigicon{width:112px;height:112px;border-radius:999px;background:var(--sand);display:flex;align-items:center;justify-content:center}
.leafgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1;font-weight:600}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:16px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#E2D8C2;border-radius:999px;padding:4px}
.seg button{min-height:44px;border:none;border-radius:999px;background:transparent;color:var(--ink2);font-size:14px;font-weight:600}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:800}
.symgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.sym{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sym.on{border:2px solid var(--olive);color:var(--olive)}
.swatch{width:46px;height:46px;border-radius:999px;border:1px solid var(--line2)}
.swatch.on{border:3px solid var(--ink)}
.opt{display:flex;align-items:center;gap:14px;text-align:left;min-height:62px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.opt.on{border:2px solid var(--olive)}
.radio{width:22px;height:22px;border-radius:999px;border:1.5px solid #B9AC90;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.on .radio{background:var(--olive);border-color:var(--olive)}
.result{text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 16px;color:var(--ink)}
.result.on{border:2px solid var(--olive)}
canvas.preview{width:100%;max-width:240px;height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(60,50,30,.18);align-self:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const UI = {

/* ---------- Saved data (stays on this device) ---------- */
const KEY = 'hiddenword.v1';
function fresh() { return { progress: {}, collections: [], mine: [], custom: {}, notes: {}, cache: {}, days: [], version: KJV, bibles: [] }; }
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (d, size, color, sw) => `<svg width="${size || 24}" height="${size || 24}" viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="${sw || 1.7}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const today = () => new Date().toISOString().slice(0, 10);
const now = () => Date.now();
const DAY = 864e5;
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dueAfter(days) { return startOfToday() + days * DAY + 4 * 3600e3; }
function verse(id) { return LIB[id] || S.custom[id] || null; }
function refOf(id) { const v = verse(id); return v ? v.ref : id; }
function rec(id) { return S.progress[id]; }
function status(id) {
  const r = rec(id); if (!r) return 'new';
  if (r.due <= now()) return 'due';
  return r.step >= MEMORIZED_STEP ? 'memorized' : 'growing';
}
function statusTag(id) {
  const s = status(id);
  if (s === 'new') return '<span class="tag new">New</span>';
  if (s === 'due') return '<span class="tag due">Review today</span>';
  if (s === 'memorized') return '<span class="tag">Memorized</span>';
  return '<span class="tag">Growing</span>';
}
const isMemorized = id => { const r = rec(id); return !!r && r.step >= MEMORIZED_STEP; };
const dueList = () => Object.keys(S.progress).filter(id => S.progress[id].due <= now()).sort((a, b) => S.progress[a].due - S.progress[b].due);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function markDay() { const d = today(); if (!S.days.includes(d)) { S.days.push(d); if (S.days.length > 400) S.days = S.days.slice(-400); } }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function cleanText(t) { return String(t || '').replace(/¶/g, '').replace(/\[\d+\]/g, '').replace(/^\s*\d+\s+/, '').replace(/\s+/g, ' ').trim(); }

/* ---------- Bible connection (through the hidden server function) ---------- */
let apiOK = false;
async function api(params) {
  const r = await fetch('/api/bible?' + new URLSearchParams(params));
  if (!r.ok) throw new Error('Bible service error ' + r.status);
  return r.json();
}
async function connect() {
  try {
    const j = await api({ action: 'bibles' });
    const list = (j.data || []).map(b => ({ id: b.id, abbr: b.abbreviationLocal || b.abbreviation || b.name, name: b.nameLocal || b.name }));
    if (list.length) { S.bibles = list; apiOK = true; save(); }
  } catch (e) { apiOK = false; }
}
function versionFor(id) {
  const r = rec(id); if (r && r.ver) return r.ver;
  const c = S.custom[id]; if (c && c.ver && !LIB[id]) return c.ver;
  return S.version || KJV;
}
async function textFor(id, ver) {
  ver = ver || versionFor(id);
  if (ver.id === 'KJV' && LIB[id]) return LIB[id].text;
  const c = S.custom[id]; if (c && c.ver && c.ver.id === ver.id) return c.text;
  const key = ver.id + '|' + id;
  if (S.cache[key]) return S.cache[key];
  if (ver.id === 'KJV' && c) return c.text;
  const j = await api({ action: 'passage', bible: ver.id, ref: id });
  const t = cleanText(j.data && j.data.content);
  if (!t) throw new Error('Verse not found');
  S.cache[key] = t; save();
  return t;
}

/* ---------- Router ---------- */
let P = null; // practice session
let R = null; // review session
let ADD = null; // add-verse state
let NC = null; // new collection state
let SH = null; // share state
function render() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'home';
  const [name, arg] = [h.split('/')[0], h.split('/').slice(1).join('/')];
  const tabsFor = { home: 'home', subject: 'home', verses: 'verses', collection: 'verses', progress: 'progress', versions: 'versions' };
  const tabs = document.getElementById('tabs');
  const tab = tabsFor[name];
  tabs.classList.toggle('hide', !tab);
  $app.classList.toggle('full', !tab);
  tabs.querySelectorAll('a').forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const screens = { home, subject, practice, review, progress, verses, collection, add, newcollection, versions: settings, share };
  (screens[name] || home)(arg);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ---------- Screens ---------- */
function backBtn(label, hash) { return `<a class="back" href="${hash}">${svg(UI.back, 18, null, 2)}${esc(label)}</a>`; }
function subjectCount(s) { return s.ids.filter(id => rec(id)).length; }
function nextIn(ids) { return ids.find(id => !rec(id)) || ids[0]; }

function home() {
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const due = dueList();
  const started = SUBJECTS.find(s => subjectCount(s) > 0 && subjectCount(s) < s.ids.length) || SUBJECTS[0];
  const tid = nextIn(started.ids);
  const t = verse(tid);
  const short = t.text.split(' ').slice(0, 11).join(' ') + (t.text.split(' ').length > 11 ? '…' : '');
  $app.innerHTML = `
    <div class="stack4"><p class="eyebrow">Hidden Word</p><h1>${greet}</h1><p class="muted">One verse at a time.</p></div>
    ${due.length ? `<a class="card row" href="#review" style="border:2px solid var(--gold)"><span class="ibox" style="background:#F1E4CC;border-radius:999px">${svg(UI.review, 24, '#7A5D1F', 1.8)}</span><span class="grow stack4"><b class="serif" style="font-size:21px">${due.length} verse${due.length > 1 ? 's' : ''} ready to review</b><span class="muted small">Keep them strong</span></span>${svg(UI.chev, 18, '#9A907E', 2)}</a>` : ''}
    <a class="hero" href="#practice/${encodeURIComponent(tid)}">
      <span class="eyebrow">${rec(tid) ? 'Practice' : 'Today’s verse'} · ${esc(started.name)}</span>
      <span class="serif" style="font-size:22px;line-height:1.3;font-style:italic">“${esc(short)}”</span>
      <span class="top" style="font-size:14px;font-weight:600"><span>${esc(t.ref)}</span><span class="lift">${rec(tid) ? 'Practice' : 'Begin'}</span></span>
    </a>
    <div class="stack"><h2>Subjects</h2>
      <div class="grid2">${SUBJECTS.map(s => { const n = subjectCount(s); return `<a class="card subj" href="#subject/${s.id}">${svg(ICONS[s.icon], 26, '#B08A3E', 1.6)}<b>${esc(s.name)}</b><span>${n ? `${n} of ${s.ids.length} planted` : `${s.ids.length} verses`}</span></a>`; }).join('')}</div>
    </div>`;
}

function verseRow(id, hash) {
  const v = verse(id); if (!v) return '';
  return `<a class="card row" href="${hash || '#practice/' + encodeURIComponent(id)}"><span class="grow stack4"><span class="vname">${esc(v.ref)}</span><span class="vtext ell">${esc(v.text)}</span></span>${statusTag(id)}</a>`;
}

function subject(sid) {
  const s = SUBJECTS.find(x => x.id === sid) || SUBJECTS[0];
  const n = subjectCount(s);
  $app.innerHTML = `
    ${backBtn('Subjects', '#home')}
    <div class="center" style="gap:10px">
      <div class="ibox" style="width:72px;height:72px;border-radius:999px;background:var(--sand)">${svg(ICONS[s.icon], 36, '#B08A3E', 1.5)}</div>
      <h1 style="font-size:44px">${esc(s.name)}</h1><p class="muted">${esc(s.desc)}</p>
      <div class="stack4" style="width:100%"><div class="bar"><i style="width:${Math.round(n / s.ids.length * 100)}%"></i></div><span class="muted small" style="font-weight:600">${n} of ${s.ids.length} verses planted</span></div>
    </div>
    <div class="stack">${s.ids.map(id => verseRow(id)).join('')}</div>
    <a class="btn" href="#practice/${encodeURIComponent(nextIn(s.ids))}">Practice next verse</a>`;
}

/* Practice: four fading steps, then plant */
const HINTS = ['Read it aloud, slowly.', 'Say it again. Fill in the blanks.', 'Just the first letters now.', 'Say it from your heart.'];
function practice(id) {
  if (!verse(id)) return go('#home');
  if (!P || P.id !== id) P = { id, level: 0, text: null, ver: versionFor(id), err: null };
  const v = verse(id);
  if (P.text == null && !P.err) {
    textFor(id, P.ver).then(t => { if (P && P.id === id) { P.text = t; render(); } })
      .catch(() => { if (P && P.id === id) { P.err = true; P.ver = LIB[id] ? KJV : (S.custom[id] && S.custom[id].ver) || KJV; P.text = LIB[id] ? LIB[id].text : v.text; render(); } });
  }
  const from = SUBJECTS.find(s => s.ids.includes(id));
  const backTo = from ? ['#subject/' + from.id, from.name] : ['#verses', 'My Verses'];
  if (P.level >= 4) return planted(id, backTo);
  const words = (P.text || '').split(' ').filter(Boolean).map((raw, i) => {
    const m = raw.match(/^([“‘"'(]*)(.*?)([.,:;!?”’"')]*)$/);
    const pre = m[1], core = m[2], post = m[3];
    let shown = core, hidden = '';
    if (P.level === 1 && i % 3 === 1) { shown = ''; hidden = core; }
    if (P.level === 2) { shown = core.charAt(0); hidden = core.slice(1); }
    if (P.level === 3) { shown = ''; hidden = core; }
    return `<span class="w">${esc(pre + shown)}${hidden ? `<span class="h" data-act="peek" role="button" tabindex="0" aria-label="Hidden word, tap to peek">${esc(hidden)}</span>` : ''}${esc(post)}</span>`;
  }).join(' ');
  const r = rec(id);
  $app.innerHTML = `
    <div class="top">${backBtn(backTo[1], backTo[0])}<a class="pill" href="#versions" aria-label="Bible version ${esc(P.ver.abbr)}. Change version">${esc(P.ver.abbr)} ${svg(UI.down, 14, null, 2.2)}</a></div>
    <div class="dots" role="img" aria-label="Step ${P.level + 1} of 4">${[0, 1, 2, 3].map(n => `<i class="${n <= P.level ? 'on' : ''}"></i>`).join('')}</div>
    <div class="practice">
      <p class="eyebrow" style="text-align:center">${esc(v.ref)}</p>
      ${P.text == null ? '<p class="empty">Opening the verse…</p>' : `<p class="words">${words}</p>`}
      ${P.err ? `<p class="muted small" style="text-align:center">Couldn’t reach that version, so this is ${esc(P.ver.abbr)}.</p>` : ''}
    </div>
    <p style="text-align:center;font-size:16px;font-weight:600;color:var(--ink2)">${HINTS[P.level]}${P.level ? ' Tap a blank to peek.' : ''}</p>
    ${r && r.ver && S.version && r.ver.id !== S.version.id ? `<p class="muted small" style="text-align:center">You planted this verse in ${esc(r.ver.abbr)}, so it stays in ${esc(r.ver.abbr)}.</p>` : ''}
    <div class="row" style="gap:12px">
      <button class="round" data-act="listen" aria-label="Listen to the verse">${svg(UI.speaker, 22, null, 1.8)}</button>
      ${P.level > 0 ? '<button class="btn ghost" style="width:auto;flex:0 0 auto" data-act="less">Show more</button>' : ''}
      <button class="btn" data-act="more" ${P.text == null ? 'disabled' : ''}>${P.level >= 3 ? 'I said it!' : 'Fade more'}</button>
    </div>`;
}
function planted(id, backTo) {
  const v = verse(id);
  const next = (() => { const s = SUBJECTS.find(x => x.ids.includes(id)); return s ? s.ids.find(x => !rec(x)) : null; })();
  $app.innerHTML = `
    <div class="center" style="flex:1;justify-content:center">
      <div class="bigicon">${svg(UI.sprout, 58, '#4F5D3A', 1.3)}</div>
      <h1>Planted in your heart</h1>
      <p class="muted" style="max-width:290px">${esc(v.ref)} will come back tomorrow for a quick review.</p>
      <p class="serif" style="font-style:italic;font-size:19px;color:var(--muted);max-width:300px">“Thy word have I hid in mine heart.” — Psalm 119:11</p>
      <div class="stack" style="width:100%;margin-top:8px">
        <a class="btn" href="${next ? '#practice/' + encodeURIComponent(next) : backTo[0]}">${next ? 'Next verse' : 'Done'}</a>
        <a class="btn ghost" href="#share/${encodeURIComponent(id)}">${svg(UI.share, 20, null, 1.8)} Share this verse</a>
        <button class="btn text" data-act="again">Practice again</button>
      </div>
    </div>`;
}
function plant(id) {
  const r = rec(id);
  if (!r) S.progress[id] = { ver: P.ver, step: 0, due: dueAfter(1), planted: today() };
  markDay(); save();
}

/* Review: reference first, then check yourself */
function review() {
  if (!R) { const q = dueList(); R = { q, i: 0, stage: 'front', knew: 0, text: null }; }
  if (!R.q.length) {
    $app.innerHTML = `${backBtn('Progress', '#progress')}<div class="center" style="flex:1;justify-content:center"><div class="bigicon">${svg(UI.check, 50, '#4F5D3A', 1.6)}</div><h1>All caught up</h1><p class="muted">No verses are due right now. They’ll come back right when they need to.</p><a class="btn" href="#home">Learn a new verse</a></div>`;
    R = null; return;
  }
  if (R.i >= R.q.length) {
    const n = R.q.length, k = R.knew, miss = n - k;
    $app.innerHTML = `${backBtn('Progress', '#progress')}<div class="center" style="flex:1;justify-content:center"><div class="bigicon">${svg(UI.sprout, 54, '#4F5D3A', 1.3)}</div><h1>Review complete</h1><p class="muted" style="max-width:290px">You knew ${k} of ${n} by heart.${miss ? ` The other ${miss === 1 ? 'one comes' : miss + ' come'} back tomorrow.` : ' Beautiful.'}</p><a class="btn" href="#progress">Back to my progress</a></div>`;
    R = null; return;
  }
  const id = R.q[R.i], v = verse(id), ver = versionFor(id);
  if (R.text == null) textFor(id, ver).then(t => { if (R && R.q[R.i] === id) { R.text = t; render(); } }).catch(() => { if (R && R.q[R.i] === id) { R.text = v.text; render(); } });
  const letters = (R.text || v.text).split(' ').map(w => { const m = w.match(/^[^A-Za-z0-9]*(.)?.*?([.,:;!?]*)$/); return (m && m[1] ? m[1] : '') + (m ? m[2] : ''); }).join(' ');
  $app.innerHTML = `
    <div class="top">${backBtn('Progress', '#progress')}<span class="muted small" style="font-weight:700">${R.i + 1} of ${R.q.length}</span></div>
    <div class="practice" style="align-items:center;text-align:center">
      <span class="eyebrow">Review · ${esc(ver.abbr)}</span>
      <h1 style="font-size:40px">${esc(v.ref)}</h1>
      ${R.stage === 'front' ? '<p class="muted" style="max-width:260px">Say it from memory. Then check yourself.</p>' : ''}
      ${R.stage === 'letters' ? `<p class="serif" style="font-size:26px;letter-spacing:.06em;color:var(--ink2);line-height:1.4">${esc(letters)}</p>` : ''}
      ${R.stage === 'shown' ? `<p class="serif" style="font-size:27px;line-height:1.3">${esc(R.text || v.text)}</p>` : ''}
    </div>
    ${R.stage !== 'shown' ? `<div class="row" style="gap:12px"><button class="btn ghost" data-act="letters" ${R.stage === 'letters' ? 'disabled' : ''}>First letters</button><button class="btn" data-act="reveal">Check my verse</button></div>` :
      `<div class="stack"><p style="text-align:center;font-weight:700;color:var(--ink2);font-size:14px">How did it go?</p><div class="row" style="gap:12px">
        <button class="btn ghost" data-act="missed" style="flex-direction:column;gap:0;border-radius:18px;min-height:62px"><span>Needed help</span><span class="small" style="color:var(--muted);font-weight:600">Back tomorrow</span></button>
        <button class="btn" data-act="knew" style="flex-direction:column;gap:0;border-radius:18px;min-height:62px"><span>I knew it</span><span class="small" style="color:#E3D7B8;font-weight:600">Back in ${INTERVALS[Math.min((rec(id).step || 0) + 1, INTERVALS.length - 1)]} days</span></button>
      </div></div>`}`;
}
function grade(knew) {
  const id = R.q[R.i], r = rec(id);
  if (knew) { r.step = Math.min((r.step || 0) + 1, INTERVALS.length - 1); r.due = dueAfter(INTERVALS[r.step]); R.knew++; }
  else { r.step = Math.max(0, (r.step || 0) - 1); r.due = dueAfter(1); }
  markDay(); save();
  R.i++; R.stage = 'front'; R.text = null; render();
}

/* Progress dashboard */
function progress() {
  const all = Object.keys(S.progress);
  const mem = all.filter(isMemorized).length, growing = all.length - mem, due = dueList().length;
  const month = today().slice(0, 7), days = S.days.filter(d => d.startsWith(month)).length;
  const leaves = all.map(id => isMemorized(id)).sort((a, b) => b - a);
  const groups = SUBJECTS.map(s => ({ name: s.name, n: s.ids.filter(isMemorized).length, t: s.ids.length }))
    .concat(S.collections.map(c => ({ name: c.name, n: c.ids.filter(isMemorized).length, t: c.ids.length })))
    .filter(g => g.t > 0 && (g.n > 0 || S.collections.some(c => c.name === g.name)));
  const list = all.sort((a, b) => (S.progress[a].due - S.progress[b].due));
  $app.innerHTML = `
    <div class="stack4"><h1>Your progress</h1><p class="muted">What you’ve hidden in your heart.</p></div>
    <div class="hero" style="gap:14px">
      <div class="row" style="align-items:flex-end;gap:12px"><span class="serif" style="font-size:76px;font-weight:600;line-height:.85">${mem}</span><span style="font-size:16px;font-weight:600;padding-bottom:4px">verse${mem === 1 ? '' : 's'} memorized</span></div>
      ${leaves.length ? `<div class="leafgrid" role="img" aria-label="${mem} memorized, ${growing} growing">${leaves.map(m => `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z" fill="${m ? '#E3D7B8' : 'none'}" stroke="${m ? '#E3D7B8' : '#B9C2A2'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`).join('')}</div>` : ''}
      <span class="small" style="color:#E3D7B8">${all.length ? `Each leaf is a verse you’ve planted. Filled leaves are memorized; a verse is memorized after it passes its 7-day review.` : 'Plant your first verse and your garden begins here.'}</span>
    </div>
    ${due ? `<a class="card row" href="#review" style="border:2px solid var(--gold)"><span class="ibox" style="background:#F1E4CC;border-radius:999px">${svg(UI.review, 24, '#7A5D1F', 1.8)}</span><span class="grow stack4"><b class="serif" style="font-size:21px">${due} verse${due > 1 ? 's' : ''} ready to review</b><span class="muted small">About ${Math.max(1, Math.round(due * 0.75))} minute${due > 1 ? 's' : ''}</span></span><span class="tag" style="background:var(--olive);color:#FBF8F1;padding:9px 15px;font-size:14px">Start</span></a>` : ''}
    <div class="grid3">
      <div class="card stat"><b>${mem}</b><span>Memorized</span></div>
      <div class="card stat"><b>${growing}</b><span>Still growing</span></div>
      <div class="card stat"><b>${days}</b><span>Days this month</span></div>
    </div>
    ${groups.length ? `<div class="stack"><h2>By subject and collection</h2>${groups.map(g => `<div class="stack4"><div class="top" style="font-size:14px"><b>${esc(g.name)}</b><span class="muted small" style="font-weight:600">${g.n} of ${g.t}</span></div><div class="bar"><i style="width:${Math.round(g.n / g.t * 100)}%"></i></div></div>`).join('')}</div>` : ''}
    <div class="stack"><h2>My planted verses</h2>${list.length ? list.map(id => verseRow(id)).join('') : '<p class="empty">Nothing planted yet. Pick a subject on the Learn tab to begin.</p>'}</div>`;
}

    <div class="stack">${next ? `<a class="btn" href="#practice/${encodeURIComponent(next)}">Practice this collection</a>` : ''}<a class="btn ghost" href="#add">${svg(UI.plus, 18, null, 2.2)} Add a verse</a></div>`;
}

/* Add a verse */
function add() {
  if (!ADD) ADD = { q: '', results: [], picked: null, colls: {}, note: '', busy: false, msg: '' };
  const res = ADD.results;
  $app.innerHTML = `
    <div class="top">${backBtn('My Verses', '#verses')}</div>
    <h1 style="font-size:34px">Add a verse</h1>
    <form class="stack" data-form="search">
      <label class="f" for="q">Find by reference or words you remember</label>
      <div class="row" style="gap:8px"><input id="q" type="search" value="${esc(ADD.q)}" placeholder="e.g. Romans 8:28 or all things work together" autocomplete="off"><button class="round" style="background:var(--olive);color:#FBF8F1;border:none" aria-label="Search">${svg(UI.search, 20, null, 2)}</button></div>
      ${apiOK ? '' : '<p class="muted small">Searching the built-in verses. When the full Bible is connected, you can find any verse.</p>'}
    </form>
    ${ADD.busy ? '<p class="empty">Searching…</p>' : ''}
    ${ADD.msg ? `<p class="empty">${esc(ADD.msg)}</p>` : ''}
    <div class="stack">${res.map((r, i) => `<button class="result ${ADD.picked === i ? 'on' : ''}" data-act="pick" data-i="${i}" aria-pressed="${ADD.picked === i}"><span class="eyebrow">${esc(r.ref)} · ${esc(r.ver.abbr)}</span><span class="serif" style="display:block;font-size:19px;line-height:1.3;margin-top:4px">${esc(r.text)}</span></button>`).join('')}</div>
    ${ADD.picked != null ? `
      <div class="stack"><span style="font-size:13px;font-weight:700;color:var(--ink2)">Save to your collections <span style="color:var(--muted);font-weight:600">(pick any)</span></span>
        <div class="chips">${S.collections.map(c => `<button class="chip ${ADD.colls[c.id] ? 'on' : ''}" data-act="togglecoll" data-id="${c.id}" aria-pressed="${!!ADD.colls[c.id]}">${esc(c.name)}</button>`).join('')}<a class="chip dash" href="#newcollection">${svg(UI.plus, 14, null, 2.6)} New</a></div>
      </div>
      <label class="f">Why this verse matters to you <span style="color:var(--muted);font-weight:600">(optional, just for you)</span><textarea id="note" rows="2" placeholder="A note to remember this moment">${esc(ADD.note)}</textarea></label>
      <button class="btn" data-act="saveverse">${(() => { const n = Object.values(ADD.colls).filter(Boolean).length; return n ? `Add to ${n} collection${n > 1 ? 's' : ''}` : 'Add verse'; })()}</button>` : ''}`;
}
async function runSearch(q) {
  ADD.q = q; ADD.results = []; ADD.picked = null; ADD.msg = ''; ADD.busy = true; render();
  const ql = q.toLowerCase().trim();
  const wordsQ = ql.split(/\s+/).filter(Boolean);
  const local = Object.values(LIB).filter(v => v.ref.toLowerCase().includes(ql) || wordsQ.every(w => v.text.toLowerCase().includes(w)))
    .map(v => ({ id: v.id, ref: v.ref, text: v.text, ver: KJV }));
  let remote = [];
  if (apiOK && S.bibles.length) {
    const b = S.version.id !== 'KJV' ? S.version : (S.bibles.find(x => /kjv|king james/i.test(x.abbr + ' ' + x.name)) || S.bibles[0]);
    try {
      const j = await api({ action: 'search', bible: b.id, q });
      const d = j.data || {};
      const vs = (d.verses || []).map(x => ({ id: x.id, ref: x.reference, text: cleanText(x.text), ver: { id: b.id, abbr: b.abbr, name: b.name } }));
      const ps = (d.passages || []).map(x => ({ id: x.id, ref: x.reference, text: cleanText(x.content), ver: { id: b.id, abbr: b.abbr, name: b.name } }));
      remote = ps.concat(vs).filter(x => x.text);
    } catch (e) {}
  }
  const seen = new Set();
  ADD.results = local.concat(remote).filter(r => { const k = r.id + r.ver.id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 12);
  ADD.busy = false;
  if (!ADD.results.length) ADD.msg = 'No verses found. Try a reference like “John 3:16” or a few words from the verse.';
  render();
}
function saveVerse() {
  const r = ADD.results[ADD.picked]; if (!r) return;
  const noteEl = document.getElementById('note'); const note = noteEl ? noteEl.value.trim() : '';
  if (!LIB[r.id] || r.ver.id !== 'KJV') S.custom[r.id] = { id: r.id, ref: r.ref, text: r.text, ver: r.ver };
  if (!S.mine.includes(r.id)) S.mine.push(r.id);
  S.collections.forEach(c => { if (ADD.colls[c.id] && !c.ids.includes(r.id)) c.ids.push(r.id); });
  if (note) S.notes[r.id] = note;
  save(); toast(r.ref + ' added'); ADD = null; go('#verses');
}

/* New collection */
function newcollection() {
  if (!NC) NC = { name: '', icon: 'moon', color: 'lavender' };
  const col = COLORS[NC.color];
  $app.innerHTML = `
    <div class="top"><h1 style="font-size:32px">New collection</h1><a class="round" href="${ADD ? '#add' : '#verses'}" aria-label="Close" style="width:44px;height:44px">${svg(UI.close, 18, null, 2.2)}</a></div>
    <div class="card row" style="padding:16px"><span class="ibox" style="background:${col.tint};width:54px;height:54px;border-radius:16px" id="pv-icon">${svg(ICONS[NC.icon], 28, col.ink, 1.6)}</span><span class="stack4"><b class="serif" style="font-size:24px;line-height:1.1" id="pv-name">${esc(NC.name || 'Your collection')}</b><span class="muted small">Preview</span></span></div>
    <label class="f">Name it in your own words<input id="ncname" type="text" maxlength="40" value="${esc(NC.name)}" placeholder="e.g. Before I sleep"></label>
    <p class="muted small" style="margin-top:-10px">Ideas: “When I’m afraid,” “Promises for Mom,” “Verses for my team.”</p>
    <div class="stack"><span style="font-size:13px;font-weight:700;color:var(--ink2)">Pick a symbol</span>
      <div class="symgrid" role="group" aria-label="Symbol">${Object.keys(ICONS).map(k => `<button class="sym ${NC.icon === k ? 'on' : ''}" data-act="ncicon" data-k="${k}" aria-pressed="${NC.icon === k}" aria-label="${k}">${svg(ICONS[k], 22, null, 1.7)}</button>`).join('')}</div></div>
    <div class="stack"><span style="font-size:13px;font-weight:700;color:var(--ink2)">Pick a color</span>
      <div class="row" style="gap:12px" role="group" aria-label="Color">${Object.keys(COLORS).map(k => `<button class="swatch ${NC.color === k ? 'on' : ''}" style="background:${COLORS[k].tint}" data-act="nccolor" data-k="${k}" aria-pressed="${NC.color === k}" aria-label="${COLORS[k].label}"></button>`).join('')}</div></div>
    <button class="btn" data-act="createcoll" style="margin-top:auto">Create collection</button>`;
  const inp = document.getElementById('ncname');
  inp.addEventListener('input', () => { NC.name = inp.value; document.getElementById('pv-name').textContent = inp.value || 'Your collection'; });
}

/* Settings: Bible version and data */
function settings() {
  const list = [KJV].concat(S.bibles.filter(b => !(b.abbr === 'KJV' && b.id === 'KJV')));
  $app.innerHTML = `
    <div class="stack4"><h1>Bible version</h1><p class="muted">Learn in the words you read at home and hear at church.</p></div>
    <div class="stack" role="group" aria-label="Bible versions">
      ${list.map(b => { const on = (S.version || KJV).id === b.id; return `<button class="opt ${on ? 'on' : ''}" data-act="setver" data-id="${esc(b.id)}" aria-pressed="${on}"><span class="radio">${on ? svg(UI.check, 13, '#FBF8F1', 3) : ''}</span><span class="grow stack4"><b>${esc(b.abbr)}</b><span class="muted small ell">${esc(b.name)}${b.id === 'KJV' ? ' · built in, works offline' : ''}</span></span></button>`; }).join('')}
    </div>
    <p class="muted small" style="text-align:center">${apiOK ? 'Verses you’ve already planted stay in the version you learned them in.' : 'More versions appear here once the app is connected to API.Bible.'}</p>
    <div class="stack"><h2>Your data</h2>
      <p class="muted">Everything you do in Hidden Word stays on this device. Nothing is sent to us.</p>
      <button class="btn ghost" data-act="export">Save a backup file</button>
      <label class="btn ghost" style="cursor:pointer">Restore from a backup<input type="file" accept="application/json" id="restore" class="sr"></label>
    </div>
    <p class="muted small" style="text-align:center">Scripture quotations marked KJV are from the King James Version (public domain).${S.bibles.length ? ' Other versions are provided through API.Bible and are copyrighted by their publishers.' : ''}</p>`;
  const f = document.getElementById('restore');
  f.addEventListener('change', async () => {
    try { const d = JSON.parse(await f.files[0].text()); if (!d.progress) throw 0; S = Object.assign(fresh(), d); save(); toast('Backup restored'); render(); }
    catch (e) { toast('That file isn’t a Hidden Word backup'); }
  });
}

/* Share a verse as an image */
function share(id) {
  const v = verse(id); if (!v) return go('#home');
  if (!SH || SH.id !== id) SH = { id, fmt: 'story', label: !!rec(id), text: null, ver: versionFor(id) };
  if (SH.text == null) textFor(id, SH.ver).then(t => { if (SH && SH.id === id) { SH.text = t; render(); } }).catch(() => { if (SH && SH.id === id) { SH.text = v.text; SH.ver = LIB[id] ? KJV : SH.ver; render(); } });
  $app.innerHTML = `
    <div class="top"><h1 style="font-size:30px">Share this verse</h1><button class="round" data-act="closeShare" aria-label="Close" style="width:44px;height:44px">${svg(UI.close, 18, null, 2.2)}</button></div>
    <canvas class="preview" id="card" width="1080" height="${SH.fmt === 'story' ? 1920 : 1080}" role="img" aria-label="Verse card for ${esc(v.ref)}"></canvas>
    <div class="seg" role="group" aria-label="Card size"><button class="${SH.fmt === 'story' ? 'on' : ''}" data-act="fmt" data-k="story" aria-pressed="${SH.fmt === 'story'}">Story</button><button class="${SH.fmt === 'square' ? 'on' : ''}" data-act="fmt" data-k="square" aria-pressed="${SH.fmt === 'square'}">Square post</button></div>
    <label class="row" style="gap:10px;min-height:44px;font-weight:600;cursor:pointer"><input type="checkbox" id="lbl" ${SH.label ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--olive);margin:0"> Add “Planted in my heart”</label>
    <div class="stack"><button class="btn" data-act="shareimg">${svg(UI.share, 20, null, 1.8)} Share image</button>
      <button class="btn ghost" data-act="invite">${svg(UI.link, 20, null, 1.8)} Invite a friend to memorize this with you</button></div>`;
  document.getElementById('lbl').addEventListener('change', e => { SH.label = e.target.checked; drawCard(); });
  drawCard();
}
function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line); return lines;
}
async function drawCard() {
  const c = document.getElementById('card'); if (!c || !SH) return;
  try { await document.fonts.ready; } catch (e) {}
  const ctx = c.getContext('2d'), W = c.width, H = c.height, story = SH.fmt === 'story';
  const v = verse(SH.id), text = SH.text || v.text;
  const bg = story ? '#F7F2E8' : '#4F5D3A', ink = story ? '#2B2A26' : '#FBF8F1', accent = story ? '#7A5D1F' : '#E3D7B8', soft = story ? '#6B655A' : '#E3D7B8';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (SH.label) {
    ctx.font = '800 30px Nunito, sans-serif'; const lbl = 'PLANTED IN MY HEART';
    const lw = ctx.measureText(lbl).width + 30 * 0.18 * lbl.length + 60;
    ctx.strokeStyle = story ? '#C9BB98' : '#8E9A72'; ctx.lineWidth = 3;
    const y = story ? 170 : 90; roundRect(ctx, (W - lw) / 2, y, lw, 76, 38); ctx.stroke();
    ctx.fillStyle = story ? '#4F5D3A' : '#E3D7B8'; spaced(ctx, lbl, W / 2, y + 49, 5);
  }
  let size = story ? 84 : 66; const maxW = W - (story ? 200 : 180);
  let lines;
  for (;;) { ctx.font = `${story ? '' : 'italic '}500 ${size}px "Cormorant Garamond", Georgia, serif`; lines = wrap(ctx, story ? text : '“' + text + '”', maxW); if (lines.length * size * 1.3 < H * (story ? 0.5 : 0.52) || size < 40) break; size -= 4; }
  const lh = size * 1.3, blockH = lines.length * lh, top = (H - blockH) / 2 + size * 0.8 - (story ? 20 : 30);
  if (story) { ctx.strokeStyle = '#B08A3E'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W / 2 - 50, top - size - 40); ctx.lineTo(W / 2 + 50, top - size - 40); ctx.stroke(); }
  ctx.fillStyle = ink; lines.forEach((l, i) => ctx.fillText(l, W / 2, top + i * lh));
  ctx.font = '800 32px Nunito, sans-serif'; ctx.fillStyle = accent;
  spaced(ctx, (v.ref + ' · ' + SH.ver.abbr).toUpperCase(), W / 2, top + blockH + 50, 5);
  ctx.font = '600 44px "Cormorant Garamond", Georgia, serif'; ctx.fillStyle = soft; ctx.fillText('Hidden Word', W / 2, H - (story ? 110 : 70));
}
function spaced(ctx, s, x, y, sp) {
  const w = ctx.measureText(s).width + sp * (s.length - 1); let cx = x - w / 2; ctx.textAlign = 'left';
  for (const ch of s) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; } ctx.textAlign = 'center';
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function shareImage() {
  const c = document.getElementById('card'); const v = verse(SH.id);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], 'hidden-word-' + SH.id.replace(/\./g, '-') + '.png', { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: v.ref }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); toast('Image saved');
}
async function invite() {
  const v = verse(SH.id); const url = location.origin + location.pathname + '#practice/' + encodeURIComponent(SH.id);
  const text = `I’m memorizing ${v.ref}. Memorize it with me on Hidden Word:`;
  try { if (navigator.share) { await navigator.share({ title: 'Hidden Word', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('Invite link copied'); } catch (e) { toast(url); }
}

/* ---------- Actions ---------- */
const ACT = {
  more() { if (P.level >= 3) { plant(P.id); P.level = 4; } else P.level++; render(); },
  less() { P.level = Math.max(0, P.level - 1); render(); },
  again() { P.level = 0; render(); },
  peek(el) { el.classList.add('peek'); setTimeout(() => el.classList.remove('peek'), 1400); },
  listen() {
    if (!('speechSynthesis' in window) || !P || !P.text) return toast('Listening isn’t available on this device');
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(refOf(P.id) + '. ' + P.text); u.rate = 0.85; speechSynthesis.speak(u);
  },
  letters() { R.stage = 'letters'; render(); },
  reveal() { R.stage = 'shown'; render(); },
  knew() { grade(true); },
  missed() { grade(false); },
  pick(el) { ADD.picked = +el.dataset.i; const n = document.getElementById('note'); if (n) ADD.note = n.value; render(); },
  togglecoll(el) { const n = document.getElementById('note'); if (n) ADD.note = n.value; ADD.colls[el.dataset.id] = !ADD.colls[el.dataset.id]; render(); },
  saveverse() { saveVerse(); },
  ncicon(el) { NC.icon = el.dataset.k; render(); },
  nccolor(el) { NC.color = el.dataset.k; render(); },
  createcoll() {
    const name = (NC.name || '').trim(); if (!name) { toast('Give your collection a name'); document.getElementById('ncname').focus(); return; }
    const c = { id: 'c' + Date.now().toString(36), name, icon: NC.icon, color: NC.color, ids: [] };
    S.collections.push(c); save(); NC = null;
    if (ADD) { ADD.colls[c.id] = true; go('#add'); } else go('#collection/' + c.id);
  },
  delcoll(el) {
    const c = S.collections.find(x => x.id === el.dataset.id);
    if (c && confirm(`Delete “${c.name}”? Your verses and progress stay.`)) { S.collections = S.collections.filter(x => x !== c); save(); go('#verses'); }
  },
  setver(el) {
    const id = el.dataset.id; S.version = id === 'KJV' ? KJV : (S.bibles.find(b => b.id === id) || KJV); save(); P = null; render();
    toast(S.version.abbr + ' selected');
  },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hidden-word-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  },
  fmt(el) { SH.fmt = el.dataset.k; render(); },
  shareimg() { shareImage(); },
  invite() { invite(); },
  closeShare() { history.length > 1 ? history.back() : go('#home'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="peek"]')) { e.preventDefault(); ACT.peek(e.target); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'search') { e.preventDefault(); const q = document.getElementById('q').value.trim(); if (q) runSearch(q); }
});
window.addEventListener('hashchange', () => { const h = location.hash; if (!h.startsWith('#review')) R = null; if (!h.startsWith('#practice')) P = null; if (!h.startsWith('#add') && !h.startsWith('#newcollection')) ADD = null; if (!h.startsWith('#newcollection')) NC = null; if (!h.startsWith('#share')) SH = null; });

/* ---------- Start ---------- */
render();
connect().then(() => { if (apiOK && /^#(versions|add)/.test(location.hash)) render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
