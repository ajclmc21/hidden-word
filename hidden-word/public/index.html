<style>
:root{--cream:#F7F2E8;--paper:#FFFDF8;--line:#E6DDC9;--line2:#D9CCAE;--ink:#2B2A26;--ink2:#4A463E;--muted:#6B655A;--olive:#4F5D3A;--gold:#B08A3E;--goldtext:#7A5D1F;--sand:#EFE6D2;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;min-height:100vh}
#app.full{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
a{color:var(--olive);text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin:0}
h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--goldtext)}
.muted{color:var(--muted);font-size:15px;line-height:1.5}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack4{display:flex;flex-direction:column;gap:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink);display:block}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:999px;border:none;background:var(--olive);color:#FBF8F1;font-size:17px;font-weight:700;padding:0 20px;width:100%}
.btn.ghost{background:var(--paper);color:var(--olive);border:1px solid var(--line2);font-size:16px}
.btn.text{background:transparent;color:var(--olive);min-height:48px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.round{width:54px;height:54px;flex-shrink:0;border-radius:999px;border:1px solid var(--line2);background:var(--paper);color:var(--olive);display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:700;background:none;border:none;color:var(--olive);padding:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;font-size:14px;font-weight:700;color:var(--ink);background:var(--paper)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;color:var(--olive);background:#EEF0E6}
.tag.due{color:var(--goldtext);background:#F1E4CC}
.tag.new{color:var(--muted);background:var(--sand)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:999px}
.serif{font-family:var(--serif)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--olive);color:#FBF8F1;border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:#E3D7B8}
.hero .lift{background:#FBF8F1;color:var(--olive);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.subj{display:flex;flex-direction:column;gap:8px}
.subj b{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1}
.subj span{font-size:12px;color:var(--muted)}
.vname{font-weight:700;font-size:15px}
.vtext{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink2)}
#tabs{position:fixed;left:0;right:0;bottom:0;background:#FBF8F1;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;font-size:12px;font-weight:600;color:var(--muted)}
#tabs a.on{color:var(--olive);font-weight:800}
#tabs.hide{display:none}
.practice{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:30px 24px;display:flex;flex-direction:column;gap:18px;justify-content:center;min-height:340px}
.words{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.3em;row-gap:10px;font-family:var(--serif);font-size:30px;line-height:1.25;text-align:center;font-weight:500}
.w{white-space:nowrap}
.w .h{color:transparent;border-bottom:2px solid var(--gold);cursor:pointer}
.w .h.peek{color:var(--goldtext)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:28px;height:6px;border-radius:999px;background:#E2D8C2}
.dots i.on{background:var(--olive)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);font-size:14px;font-weight:600}
.chip.on{background:var(--olive);border-color:var(--olive);color:#FBF8F1;font-weight:700}
.chip.dash{border-style:dashed;color:var(--olive);font-weight:700;display:inline-flex;align-items:center;gap:6px}
input[type=text],input[type=search],textarea{width:100%;background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink)}
textarea{resize:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink2)}
.ibox{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.bigicon{width:112px;height:112px;border-radius:999px;background:var(--sand);display:flex;align-items:center;justify-content:center}
.leafgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1;font-weight:600}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:16px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#E2D8C2;border-radius:999px;padding:4px}
.seg button{min-height:44px;border:none;border-radius:999px;background:transparent;color:var(--ink2);font-size:14px;font-weight:600}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:800}
.symgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.sym{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sym.on{border:2px solid var(--olive);color:var(--olive)}
.swatch{width:46px;height:46px;border-radius:999px;border:1px solid var(--line2)}
.swatch.on{border:3px solid var(--ink)}
.opt{display:flex;align-items:center;gap:14px;text-align:left;min-height:62px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.opt.on{border:2px solid var(--olive)}
.radio{width:22px;height:22px;border-radius:999px;border:1.5px solid #B9AC90;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.on .radio{background:var(--olive);border-color:var(--olive)}
.result{text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 16px;color:var(--ink)}
.result.on{border:2px solid var(--olive)}
canvas.preview{width:100%;max-width:240px;height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(60,50,30,.18);align-self:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.round.speaking{background:var(--olive);color:#FBF8F1;border-color:var(--olive)}
.bgrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin:0 -22px;padding-left:22px;padding-right:22px}
.bgt{flex:0 0 52px;height:52px;border-radius:14px;border:1px solid rgba(0,0,0,.12);cursor:pointer}
.bgt.on{outline:3px solid var(--olive);outline-offset:2px}
.fontrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fontt{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:inherit}
.fontt.on{border:2px solid var(--olive)}
input[type=range]{width:100%;height:32px}
.handle{width:44px;height:44px;margin-left:-10px;border:none;background:none;color:#9A907E;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px}
.handle:active{cursor:grabbing}
.drag-ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;box-shadow:0 14px 34px rgba(60,50,30,.25);opacity:.96;margin:0}
.dragging{opacity:.35}
[data-drop].over{border:2px solid var(--olive);background:#F1F3EA;transform:scale(1.02)}
[data-drop]{transition:transform .12s,background .12s}
body.is-dragging{user-select:none;-webkit-user-select:none}
.picker{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

let apiOK = false;

  if (ver.id === 'KJV' && LIB[id]) return LIB[id].text;
  const c = S.custom[id]; if (c && c.ver && c.ver.id === ver.id) return c.text;
  const key = ver.id + '|' + id;
  if (S.cache[key]) return S.cache[key];
  if (ver.id === 'KJV' && c) return c.text;
  const j = await api({ action: 'passage', bible: ver.id, ref: id });

/* Practice: four fading steps, then plant */
const HINTS = ['Read it aloud, slowly.', 'Say it again. Fill in the blanks.', 'Now most of the words are hidden.', 'Just the first letters now.', 'Say it from your heart.'];
const STEPS = HINTS.length, LAST = STEPS - 1, DONE = STEPS;
function wordsHTML(text, level) {
  return (text || '').split(' ').filter(Boolean).map((raw, i) => {
    const m = raw.match(/^([“‘"'(]*)(.*?)([.,:;!?”’"')]*)$/);
    const pre = m[1], core = m[2], post = m[3];
    let shown = core, hidden = '';
    if (level === 1 && i % 3 === 1) { shown = ''; hidden = core; }
    if (level === 2 && i % 3 !== 0) { shown = ''; hidden = core; }
    if (level === 3) { shown = core.charAt(0); hidden = core.slice(1); }
    if (level >= 4) { shown = ''; hidden = core; }
    return `<span class="w">${esc(pre + shown)}${hidden ? `<span class="h" data-act="peek" role="button" tabindex="0" aria-label="Hidden word, tap to peek">${esc(hidden)}</span>` : ''}${esc(post)}</span>`;
  }).join(' ');
}

/* Passages: learn verse by verse, then link them together */
function vnum(p, i) { return p.v[i][0]; }
function rangeRef(p, k) { return k === 1 ? `${p.bookName} ${p.ch}:${vnum(p, 0)}` : `${p.bookName} ${p.ch}:${vnum(p, 0)}–${vnum(p, k - 1)}`; }

}

let C = null; // chain session

  const k = Math.max(1, Math.min(p.vids.length, parseInt(ks, 10) || p.vids.length));
  const key = pid + '/' + k;
  if (!C || C.key !== key) C = { key, p, k, level: 0, text: null, ver: versionFor(p.vids[0]) };
  if (C.text == null) Promise.all(p.vids.slice(0, k).map(v => textFor(v, C.ver).catch(() => LIB[v].text))).then(ts => { if (C && C.key === key) { C.text = ts.join(' '); render(); } });
  if (C.level >= DONE) return chainDone(p, k);

  const letters = (R.text || v.text).split(' ').map(w => { const m = w.match(/^[^A-Za-z0-9]*(.)?.*?([.,:;!?]*)$/); return (m && m[1] ? m[1] : '') + (m ? m[2] : ''); }).join(' ');

        <button class="btn ghost" data-act="missed" style="flex-direction:column;gap:0;border-radius:18px;min-height:62px"><span>Needed help</span><span class="small" style="color:var(--muted);font-weight:600">Back tomorrow</span></button>

function grade(knew) {

}

/* Drag and drop (mouse and touch) */
let MOVE = null, DRAG = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if (!h) return;
  const src = h.closest('.dragrow'), r = src.getBoundingClientRect();
  DRAG = { id: h.dataset.drag, src, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, moved: false, ghost: null, over: null };
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  if (!DRAG.moved) {
    if (Math.hypot(e.clientX - DRAG.x0, e.clientY - DRAG.y0) < 6) return;
    if (!S.collections.length) { DRAG = null; toast('Make a collection first'); return; }
    DRAG.moved = true; MOVE = null;
    const g = DRAG.src.cloneNode(true); g.classList.add('drag-ghost'); g.style.width = DRAG.w + 'px';
    document.body.appendChild(g); DRAG.ghost = g; DRAG.src.classList.add('dragging'); document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  DRAG.ghost.style.transform = `translate(${e.clientX - DRAG.dx}px, ${e.clientY - DRAG.dy}px) rotate(-1.5deg)`;
  const el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest('[data-drop]');
  if (DRAG.over && DRAG.over !== t) DRAG.over.classList.remove('over');
  if (t) t.classList.add('over'); DRAG.over = t;
  if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > innerHeight - 110) window.scrollBy(0, 12);
}, { passive: false });
function endDrag() {
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  if (d.ghost) d.ghost.remove();
  d.src.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  if (d.over) d.over.classList.remove('over');
  if (d.moved) { if (d.over) { addToCollection(d.over.dataset.drop, d.id); render(); } }
  else { MOVE = MOVE === d.id ? null : d.id; render(); }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (e.target.closest('[data-drop]') && document.body.classList.contains('is-dragging')) e.preventDefault(); }, true);

async function runSearch(q) {
  ADD.q = q; ADD.results = []; ADD.picked = null; ADD.msg = ''; ADD.busy = true; render();
  const ql = q.toLowerCase().trim();
  const wordsQ = ql.split(/\s+/).filter(Boolean);
  const local = Object.values(LIB).filter(v => v.ref.toLowerCase().includes(ql) || wordsQ.every(w => v.text.toLowerCase().includes(w)))
    .map(v => ({ id: v.id, ref: v.ref, text: v.text, ver: KJV }));
  let remote = [];
  if (apiOK && S.bibles.length) {
    const b = S.version.id !== 'KJV' ? S.version : (S.bibles.find(x => /kjv|king james/i.test(x.abbr + ' ' + x.name)) || S.bibles[0]);
    try {
      const j = await api({ action: 'search', bible: b.id, q });
      const d = j.data || {};
      const vs = (d.verses || []).map(x => ({ id: x.id, ref: x.reference, text: cleanText(x.text), ver: { id: b.id, abbr: b.abbr, name: b.name } }));
      const ps = (d.passages || []).map(x => ({ id: x.id, ref: x.reference, text: cleanText(x.content), ver: { id: b.id, abbr: b.abbr, name: b.name } }));
      remote = ps.concat(vs).filter(x => x.text);
    } catch (e) {}
  }
  const seen = new Set();
  ADD.results = local.concat(remote).filter(r => { const k = r.id + r.ver.id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 12);
  ADD.busy = false;
  if (!ADD.results.length) ADD.msg = 'No verses found. Try a reference like “John 3:16” or a few words from the verse.';
  render();
}

  return String(ref || '')
    .replace(/^([123])\s+(?=[A-Za-z])/, (m, n) => ORD[n] + ' ')
    .replace(/(\d+):(\d+)\s*[–—-]\s*(\d+):(\d+)/g, '$1, verse $2, through chapter $3, verse $4')
    .replace(/(\d+):(\d+)\s*(?:[–—-]|\bto\b)\s*(\d+)/g, '$1, verses $2 through $3')
    .replace(/(\d+):(\d+)/g, '$1, verse $2')
    .replace(/^Psalms\b/, 'Psalm');
}
function spoken(t) { return t.replace(/\bLORD\b/g, 'Lord').replace(/\bGOD\b/g, 'God').replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim(); }
function chunks(t) {
  const parts = t.match(/[^.;:!?]+[.;:!?]*/g) || [t], out = []; let cur = '';
  parts.forEach(p => { if ((cur + p).length > 180 && cur) { out.push(cur.trim()); cur = p; } else cur += p; });
  if (cur.trim()) out.push(cur.trim()); return out;
}
function setSpeakBtns(on) { document.querySelectorAll('[data-act=listen]').forEach(b => { b.setAttribute('aria-label', on ? 'Stop reading' : 'Listen'); b.classList.toggle('speaking', on); const lbl = b.dataset.say === 'sample' ? (on ? ' Stop' : ' Play a sample') : ''; b.innerHTML = (on ? svg('M7 7h10v10H7z', 20, null, 2) : svg(UI.speaker, 22, null, 1.8)) + lbl; }); }
function stopSpeaking() { SPEAKING = false; try { speechSynthesis.cancel(); } catch (e) {} setSpeakBtns(false); }
function speakToggle(which) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { toast('Reading aloud isn’t available in this browser. Try Safari or Chrome.'); return; }
  if (SPEAKING) { stopSpeaking(); return; }
  let ref = '', text = '';
  if (which === 'chain' && C && C.text) { ref = rangeRef(C.p, C.k); text = C.text; }
  else if (which === 'review' && R && R.q[R.i]) { ref = refOf(R.q[R.i]); text = R.text || verse(R.q[R.i]).text; }
  else if (which === 'sample') { ref = 'Psalm 119:11'; text = LIB['PSA.119.11'].text; }
  else if (P && P.text) { ref = refOf(P.id); text = P.text; }
  if (!text) { toast('One moment, the verse is still opening'); return; }
  const pieces = [spokenRef(ref)].concat(chunks(spoken(text)));
  try { speechSynthesis.cancel(); } catch (e) {}
  SPEAKING = true; setSpeakBtns(true);
  let i = 0, started = false;
  const next = () => {
    if (!SPEAKING) return;
    if (i >= pieces.length) { stopSpeaking(); return; }
    const u = new SpeechSynthesisUtterance(pieces[i++]);
    u.lang = (VOICE && VOICE.lang) || 'en-US'; if (VOICE) u.voice = VOICE; u.rate = rateNow(); u.pitch = 1;
    u.onstart = () => { started = true; };
    u.onend = () => setTimeout(next, 250);
    u.onerror = e => { if (e && (e.error === 'interrupted' || e.error === 'canceled')) return; stopSpeaking(); toast('Couldn’t read aloud. Check your volume and try again.'); };
    speechSynthesis.speak(u);
    try { speechSynthesis.resume(); } catch (e) {}
  };
  setTimeout(next, 150); // Safari drops speech that starts right after cancel()
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !warnedSilent) {
    warnedSilent = true;
    setTimeout(() => { if (SPEAKING) toast('No sound? Flip off the silent switch on the side of your iPhone and turn up the volume.'); }, 1800);
  }
  setTimeout(() => { if (SPEAKING && !started) { stopSpeaking(); toast('Your device didn’t start reading. Check that the volume is up and silent mode is off.'); } }, 4000);
}

/* ---------- Actions ---------- */
const ACT = {
  more() { if (P.level >= LAST) { plant(P.id); P.level = DONE; } else P.level++; render(); },
  less() { P.level = Math.max(0, P.level - 1); render(); },
  again() { P.level = 0; render(); },
  peek(el) { el.classList.add('peek'); setTimeout(() => el.classList.remove('peek'), 1400); },
  listen(el) { speakToggle(el.dataset.say || 'practice'); },
  letters() { R.stage = 'letters'; render(); },
  reveal() { R.stage = 'shown'; render(); },
  knew() { grade(true); },
  missed() { grade(false); },
  cmore() { if (C.level >= LAST) C.level = DONE; else C.level++; render(); },
  cless() { C.level = Math.max(0, C.level - 1); render(); },
  setrate(el) { S.speech.rate = el.dataset.k; save(); stopSpeaking(); render(); speakToggle('sample'); },
  welpick(el) { WEL.pick = +el.dataset.i; WEL.custom = ''; render(); },
  welnext() {
    const idea = WEL.custom ? null : IDEAS[WEL.pick];
    if (idea && idea.passages) { S.onboarded = true; S.homeTab = 'passages'; save(); WEL = null; go('#home'); return; }
    WEL.keep = {}; go('#firstcoll');
  },
  welskip() { S.onboarded = true; save(); WEL = null; go('#home'); },
  welkeep(el) { const id = el.dataset.id; WEL.keep[id] = WEL.keep[id] === false; render(); },
  welstart() {
    const idea = WEL.custom ? null : IDEAS[WEL.pick];
    const ids = idea ? idea.ids.filter(id => WEL.keep[id] !== false) : [];
    const c = makeCollection(WEL.custom || idea.label, idea ? idea.icon : 'leaf', idea ? idea.color : 'olive', ids);
    if (ids.length && !S.focus) S.focus = ids[0];
    S.onboarded = true; save(); WEL = null;
    if (ids.length) { toast(`“${c.name}” is ready`); go('#home'); }
    else { ADD = { q: '', results: [], picked: null, colls: { [c.id]: true }, note: '', busy: false, msg: '' }; go('#add'); }
  },
  mmtoggle(el) { MM.off[el.dataset.id] = !MM.off[el.dataset.id]; render(); },
  mmsave() {
    const [kind, key] = MM.arg.split(':');
    const subj = kind === 's' ? SUBJECTS.find(x => x.id === key) : null, pas = kind === 'p' ? PASS[key] : null;
    const ids = subj ? subj.ids.filter(id => !MM.off[id]) : ['P:' + pas.id];
    const name = (MM.name || '').trim() || (subj ? subj.name : pas.name);
    const c = makeCollection(name, subj ? subj.icon : pas.icon, subj ? 'olive' : 'gold', ids);
    save(); MM = null; toast(`“${c.name}” added to your collections`); go('#collection/' + c.id);
  },
  hometab(el) { S.homeTab = el.dataset.k; save(); render(); },
  setfocus(el) { S.focus = el.dataset.id; save(); FQ = ''; toast(refOf(S.focus) + ' is your focus verse'); go('#home'); },
  clearfocus() { S.focus = null; save(); toast('The app will suggest verses'); go('#home'); },
  togglefocus(el) { const id = el.dataset.id; S.focus = S.focus === id ? null : id; save(); toast(S.focus ? refOf(id) + ' is your focus verse' : 'Focus cleared'); render(); },
  pickcoll(el) {
    const c = S.collections.find(x => x.id === el.dataset.id), id = el.dataset.v; if (!c) return;
    if (c.ids.includes(id)) { c.ids = c.ids.filter(x => x !== id); save(); toast(`Removed from “${c.name}”`); }
    else addToCollection(c.id, id);
    render();
  },
  pick(el) { ADD.picked = +el.dataset.i; const n = document.getElementById('note'); if (n) ADD.note = n.value; render(); },
  togglecoll(el) { const n = document.getElementById('note'); if (n) ADD.note = n.value; ADD.colls[el.dataset.id] = !ADD.colls[el.dataset.id]; render(); },
  saveverse() { saveVerse(); },
  ncicon(el) { NC.icon = el.dataset.k; render(); },
  nccolor(el) { NC.color = el.dataset.k; render(); },
  createcoll() {
    const name = (NC.name || '').trim(); if (!name) { toast('Give your collection a name'); document.getElementById('ncname').focus(); return; }
    const c = { id: 'c' + Date.now().toString(36), name, icon: NC.icon, color: NC.color, ids: [] };
    S.collections.push(c); save(); NC = null;
    if (ADD) { ADD.colls[c.id] = true; go('#add'); } else go('#collection/' + c.id);
  },
  delcoll(el) {
    const c = S.collections.find(x => x.id === el.dataset.id);
    if (c && confirm(`Delete “${c.name}”? Your verses and progress stay.`)) { S.collections = S.collections.filter(x => x !== c); save(); go('#verses'); }
  },
  setver(el) {
    const id = el.dataset.id; S.version = id === 'KJV' ? KJV : (S.bibles.find(b => b.id === id) || KJV); save(); P = null; render();
    toast(S.version.abbr + ' selected');
  },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hidden-word-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  },
  fmt(el) { SH.fmt = el.dataset.k; render(); },
  dtab(el) { SH.tab = el.dataset.k; render(); },
  dbg(el) { const D = designPrefs(); D.bg = el.dataset.k; PHOTO = null; if (D.ink !== 'auto') D.ink = 'auto'; save(); render(); },
  dphoto(el) { const p = BG_PHOTOS.find(x => x.id === el.dataset.k); if (!p) return; const img = new Image(); img.onload = () => { PHOTO = { id: p.id, img }; render(); }; img.onerror = () => toast('That photo couldn\u2019t be loaded'); img.src = p.src; },
  dfont(el) { designPrefs().font = el.dataset.k; save(); render(); },
  dalign(el) { designPrefs().align = el.dataset.k; save(); render(); },
  dink(el) { designPrefs().ink = el.dataset.k; save(); render(); },
  shareto(el) { shareTo(el.dataset.k); },
  invite() { invite(); },
  closeShare() { nav(PREV && !PREV.startsWith('#share') ? PREV : '#home'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="peek"]')) { e.preventDefault(); ACT.peek(e.target); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'search') { e.preventDefault(); const q = document.getElementById('q').value.trim(); if (q) runSearch(q); }
});


/* ---------- Start ---------- */
if (!S.onboarded) { if (Object.keys(S.progress).length || S.mine.length || S.collections.length) { S.onboarded = true; save(); } else if (!location.hash || location.hash === '#home') { ROUTE = '#welcome'; } }
render();
connect().then(() => { if (apiOK && /^#(versions|add)/.test(ROUTE)) render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
